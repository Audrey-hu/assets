name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build (PWA)
        run: pnpm build

      - name: Build single file
        run: pnpm build:single

      - name: Assemble site
        run: |
          mkdir -p site
          cp -R dist/. site/
          cp "dist-single/人生账本.html" "site/人生账本.html"
          cp "启动人生账本.command" "site/" || true

      - uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动开启（Source = GitHub Actions）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
